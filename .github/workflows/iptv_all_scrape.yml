# 第三步：合并文件（增加前后大小记录）
- name: Merge source files
  run: |
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Start merging files" | tee -a scrape_log.txt

    # 记录合并前主大小
    if [ -f "iptv.bin" ]; then
      PRE_SIZE=$(du -h iptv.bin | awk '{print $1}')
      echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] iptv.bin size before merge: ${PRE_SIZE}" | tee -a scrape_log.txt
    else
      echo "[$(date '+%Y-%m-%d %H:%M:%S')] [WARN] iptv.bin not found, will create from ipcenter" | tee -a scrape_log.txt
      > iptv.bin
    fi

    if [ -f "ipcenter.bin" ] && [ -s "ipcenter.bin" ]; then
      echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Merge ipcenter.bin into iptv.bin" | tee -a scrape_log.txt
      echo -e "\n\n# Merge" >> iptv.bin
      cat ipcenter.bin >> iptv.bin
      MERGE_STATUS="merged"
    else
      echo "[$(date '+%Y-%m-%d %H:%M:%S')] [WARN] ipcenter.bin not found or empty, skip merge" | tee -a scrape_log.txt
      MERGE_STATUS="skipped"
    fi

    # 记录合并后大小
    if [ -f "iptv.bin" ]; then
      POST_SIZE=$(du -h iptv.bin | awk '{print $1}')
      echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] iptv.bin size after merge: ${POST_SIZE}" | tee -a scrape_log.txt
      echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Merge ${MERGE_STATUS} (primary source was ${PRIMARY_SUCCESS:-unknown})" | tee -a scrape_log.txt
    else
      echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] iptv.bin missing after merge" | tee -a scrape_log.txt
    fi

    rm -f ipcenter.bin raw.txt
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Merge task finished" | tee -a scrape_log.txt
    echo "" >> scrape_log.txt
