name: iptv_all_scrape

on:
  schedule:
    - cron: '0 6,12,18 * * *'
      timezone: 'Asia/Shanghai' 
  workflow_dispatch:

jobs:
  scrape_merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Init log file
      - name: Initialize log
        run: |
          echo "=== IPTV Scrape Log - $(date '+%Y-%m-%d %H:%M:%S') ===" > scrape_log.txt
          echo "Trigger event: ${{ github.event_name }}" >> scrape_log.txt
          echo "=========================================" >> scrape_log.txt
          echo "" >> scrape_log.txt

      # Fetch source from host list and generate iptv.bin
      - name: Fetch ZB source to iptv.bin
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Start probing host list for iptv.bin" | tee -a scrape_log.txt
          
          HOST_LIST=(
            "124.135.134.159:9003"
            "106.57.6.77:3000"
            "115.194.171.196:1234"
            "116.168.160.134:3000"
            "123.149.76.28:7788"
            "182.122.164.229:3000"
            "106.118.123.15:1234"
            "106.57.6.77:3000"
            "113.232.17.82:1234"
            "113.88.79.48:5007"
            "114.230.79.148:8088"
            "115.194.171.196:1234"
            "116.168.160.134:3000"
            "119.165.80.210:1234"
            "120.48.113.49:6006"
            "123.4.197.66:1234"
            "124.134.219.106:1234"
            "124.152.235.11:5566"
            "124.221.146.169:7001"
          )

          SELECTED_HOST=""
          for HOST in "${HOST_LIST[@]}"; do
            CHECK_URL="http://${HOST}/608807420"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Probing host: ${HOST}" | tee -a scrape_log.txt
            if curl -s --connect-timeout 5 --max-time 8 "$CHECK_URL" >/dev/null; then
              SELECTED_HOST="${HOST}"
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Host ${HOST} available, selected for scraping" | tee -a scrape_log.txt
              break
            else
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [WARN] Host ${HOST} unreachable, try next" | tee -a scrape_log.txt
            fi
          done

          if [ -n "${SELECTED_HOST}" ]; then
            SOURCE_URL="http://${SELECTED_HOST}/"
            curl -s "$SOURCE_URL" > iptv.bin
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Fetch completed from ${SELECTED_HOST}, saved to iptv.bin" | tee -a scrape_log.txt
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] All hosts unreachable, cannot fetch source" | tee -a scrape_log.txt
          fi

          if [ -s "iptv.bin" ]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] iptv.bin size: $(du -h iptv.bin | awk '{print $1}')" | tee -a scrape_log.txt
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] iptv.bin is empty" | tee -a scrape_log.txt
          fi

          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Host scraping task finished" | tee -a scrape_log.txt
          echo "" >> scrape_log.txt
        continue-on-error: true

      # Fetch and convert secondary source to ipcenter.bin
      - name: Fetch & convert secondary source to ipcenter.bin
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Start fetch and convert secondary source to ipcenter.bin" | tee -a scrape_log.txt
          
          if curl -s http://studio.hsgf.net:8882/txt > raw.txt; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] raw.txt fetched successfully" | tee -a scrape_log.txt
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] Failed to fetch raw.txt" | tee -a scrape_log.txt
          fi

          echo "#EXTM3U" > ipcenter.bin
          sed '/更新时间/d;/http:\/\/127.0.0.1/d' raw.txt | while IFS=, read -r name url;do
            [ -z "$url" ] && continue
            echo '#EXTINF:-1 group-title="IPTV",'"$name" >> ipcenter.bin
            echo "$url" >> ipcenter.bin
            echo "" >> ipcenter.bin
          done

          if [ -s "ipcenter.bin" ]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] ipcenter.bin generated, size: $(du -h ipcenter.bin | awk '{print $1}')" | tee -a scrape_log.txt
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [WARN] ipcenter.bin empty or no valid data" | tee -a scrape_log.txt
          fi

          rm -f raw.txt
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Secondary source convert task finished" | tee -a scrape_log.txt
          echo "" >> scrape_log.txt
        continue-on-error: true

      # Merge files
      - name: Merge source files
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Start merging files" | tee -a scrape_log.txt
          
          if [ -f "ipcenter.bin" ] && [ -s "ipcenter.bin" ]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Merge ipcenter.bin into iptv.bin" | tee -a scrape_log.txt
            echo -e "\n\n# Merge" >> iptv.bin
            cat ipcenter.bin >> iptv.bin
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Merge completed" | tee -a scrape_log.txt
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [WARN] ipcenter.bin not found or empty, skip merge" | tee -a scrape_log.txt
          fi

          rm -f ipcenter.bin raw.txt
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Merge task finished" | tee -a scrape_log.txt
          echo "" >> scrape_log.txt

      # Commit and push updates
      - name: Commit & push changes
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Start commit and push" | tee -a scrape_log.txt
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add iptv.bin scrape_log.txt

          if git diff --staged --quiet; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] No file changes, skip commit" | tee -a scrape_log.txt
          else
            git commit -m "update $(date '+%Y-%m-%d %H:%M:%S')"
            if git push; then
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Commit & push success" | tee -a scrape_log.txt
            else
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] Push failed" | tee -a scrape_log.txt
            fi
          fi

          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Commit task finished" | tee -a scrape_log.txt
          echo "" >> scrape_log.txt
