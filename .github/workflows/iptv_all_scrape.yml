name: iptv_all_scrape

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

jobs:
  scrape_merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize log
        run: |
          echo "=== IPTV Scrape Log - $(date '+%Y-%m-%d %H:%M:%S') ===" > scrape_log.txt
          echo "Trigger event: ${{ github.event_name }}" >> scrape_log.txt
          echo "=========================================" >> scrape_log.txt
          echo "" >> scrape_log.txt

      - name: Fetch ZB source to iptv.bin
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Start probing host list for iptv.bin" | tee -a scrape_log.txt

          HOST_LIST=(
            "106.118.123.217:1234"
            "106.14.71.211:1234"
            "112.103.141.24:1234"
            "115.57.113.205:1234"
            "116.62.207.172:1234"
            "117.70.26.219:1234"
            "119.185.71.139:1234"
            "120.48.113.49:6006"
            "182.244.168.103:3000"
            "220.185.84.219:1234"
            "221.12.123.211:1234"
            "222.134.19.49:8090"
            "36.48.10.179:1234"
            "39.170.44.191:11234"
            "47.108.115.255:34010"
            "47.109.100.117:1234"
            "61.184.23.227:1234"
            "82.156.245.233:30008"
          )

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          SELECTED_HOST=""
          for HOST in "${HOST_LIST[@]}"; do
            CHECK_URL="http://${HOST}/"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Probing host: ${HOST} (using root path)" | tee -a scrape_log.txt

            TMP_ERR=$(mktemp)
            HTTP_CODE=$(curl -s -L -A "$UA" --connect-timeout 5 --max-time 8 --max-redirs 20 -o /dev/null -w "%{http_code}" "$CHECK_URL" 2>"$TMP_ERR") || HTTP_CODE="000"
            if [[ "$HTTP_CODE" =~ ^2 ]]; then
              SELECTED_HOST="${HOST}"
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Host ${HOST} available (HTTP ${HTTP_CODE}), selected for scraping" | tee -a scrape_log.txt
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEBUG] curl verbose output for ${HOST}:" >> scrape_log.txt
              cat "$TMP_ERR" >> scrape_log.txt
              rm -f "$TMP_ERR"
              break
            else
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [WARN] Host ${HOST} invalid response (HTTP ${HTTP_CODE}), try next" | tee -a scrape_log.txt
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEBUG] curl verbose output for ${HOST}:" >> scrape_log.txt
              cat "$TMP_ERR" >> scrape_log.txt
              rm -f "$TMP_ERR"
            fi
          done

          PRIMARY_SUCCESS=false
          if [ -n "${SELECTED_HOST}" ]; then
            SOURCE_URL="http://${SELECTED_HOST}/"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Fetching primary source from ${SOURCE_URL}" | tee -a scrape_log.txt

            TMP_ERR=$(mktemp)
            HTTP_CODE=$(curl -s -L -A "$UA" --connect-timeout 10 --max-time 30 --max-redirs 20 -o iptv.bin -w "%{http_code}" "$SOURCE_URL" 2>"$TMP_ERR")
            CURL_EXIT=$?

            if [ ${CURL_EXIT} -eq 0 ] && [ "${HTTP_CODE}" = "200" ]; then
              if [ -s "iptv.bin" ]; then
                PRIMARY_SUCCESS=true
                SIZE=$(du -h iptv.bin | awk '{print $1}')
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Primary source fetched successfully, size: ${SIZE}" | tee -a scrape_log.txt
              else
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] Primary source returned HTTP 200 but file is empty" | tee -a scrape_log.txt
              fi
            else
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] Primary source fetch failed (exit ${CURL_EXIT}, HTTP ${HTTP_CODE})" | tee -a scrape_log.txt
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEBUG] curl verbose output for download:" >> scrape_log.txt
              cat "$TMP_ERR" >> scrape_log.txt
            fi
            rm -f "$TMP_ERR"
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] No reachable host found for primary source" | tee -a scrape_log.txt
          fi

          if [ "${PRIMARY_SUCCESS}" = false ]; then
            echo "#EXTM3U" > iptv.bin
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [WARN] Primary source unavailable, created empty iptv.bin as placeholder" | tee -a scrape_log.txt
          fi

          echo "${PRIMARY_SUCCESS}" > primary_status.txt
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Host scraping task finished" | tee -a scrape_log.txt
          echo "" >> scrape_log.txt

      - name: Fetch & convert secondary source to ipcenter.bin
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Start fetch and convert secondary source to ipcenter.bin" | tee -a scrape_log.txt

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          if curl -s -L -A "$UA" --connect-timeout 10 --max-time 30 -o raw.txt http://studio.hsgf.net:8882/txt; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] raw.txt fetched successfully" | tee -a scrape_log.txt
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] Failed to fetch raw.txt" | tee -a scrape_log.txt
            touch raw.txt
          fi

          echo "#EXTM3U" > ipcenter.bin
          sed '/更新时间/d;/http:\/\/127.0.0.1/d' raw.txt | while IFS=, read -r name url; do
            [ -z "$url" ] && continue
            echo '#EXTINF:-1 group-title="IPTV",'"$name" >> ipcenter.bin
            echo "$url" >> ipcenter.bin
            echo "" >> ipcenter.bin
          done

          if [ -s "ipcenter.bin" ]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] ipcenter.bin generated, size: $(du -h ipcenter.bin | awk '{print $1}')" | tee -a scrape_log.txt
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [WARN] ipcenter.bin empty or no valid data" | tee -a scrape_log.txt
          fi

          rm -f raw.txt
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Secondary source convert task finished" | tee -a scrape_log.txt
          echo "" >> scrape_log.txt

      # ---------- 调整后的合并步骤 ----------
      - name: Merge source files
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Start merging files" | tee -a scrape_log.txt

          if [ -f "primary_status.txt" ]; then
            PRIMARY_SUCCESS=$(cat primary_status.txt)
          else
            PRIMARY_SUCCESS="false"
          fi

          # 备份原始 iptv.bin（主源）
          if [ -f "iptv.bin" ]; then
            PRE_SIZE=$(du -h iptv.bin | awk '{print $1}')
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] iptv.bin size before merge: ${PRE_SIZE}" | tee -a scrape_log.txt
            mv iptv.bin iptv.bin.primary
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [WARN] iptv.bin not found, will create from ipcenter" | tee -a scrape_log.txt
            > iptv.bin.primary  # 空文件
          fi

          MERGE_STATUS=""
          if [ -f "ipcenter.bin" ] && [ -s "ipcenter.bin" ]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Using ipcenter.bin as base (group information first)" | tee -a scrape_log.txt
            # 先写入 ipcenter.bin（包含 #EXTM3U）
            cat ipcenter.bin > iptv.bin
            # 再追加主源内容，但跳过其第一行（#EXTM3U），避免重复头部
            if [ -s "iptv.bin.primary" ]; then
              echo -e "\n\n# Merge from primary source" >> iptv.bin
              tail -n +2 iptv.bin.primary >> iptv.bin
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Primary source appended (header removed)" | tee -a scrape_log.txt
            else
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [WARN] Primary source empty, skipping append" | tee -a scrape_log.txt
            fi
            MERGE_STATUS="merged (ipcenter first)"
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [WARN] ipcenter.bin not found or empty, keeping primary only" | tee -a scrape_log.txt
            # 无 ipcenter，直接使用主源备份
            if [ -s "iptv.bin.primary" ]; then
              mv iptv.bin.primary iptv.bin
            else
              # 两者都空，创建最小文件
              echo "#EXTM3U" > iptv.bin
            fi
            MERGE_STATUS="skipped (only primary)"
          fi

          # 清理临时文件
          rm -f iptv.bin.primary ipcenter.bin primary_status.txt

          if [ -f "iptv.bin" ]; then
            POST_SIZE=$(du -h iptv.bin | awk '{print $1}')
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] iptv.bin size after merge: ${POST_SIZE}" | tee -a scrape_log.txt
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Merge summary: ${MERGE_STATUS}" | tee -a scrape_log.txt
          else
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] iptv.bin missing after merge" | tee -a scrape_log.txt
          fi

          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Merge task finished" | tee -a scrape_log.txt
          echo "" >> scrape_log.txt

      - name: Commit & push changes
        run: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Start commit and push" | tee -a scrape_log.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add iptv.bin scrape_log.txt

          if git diff --staged --quiet; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] No file changes, skip commit" | tee -a scrape_log.txt
          else
            git commit -m "update $(date '+%Y-%m-%d %H:%M:%S')"
            if git push; then
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Commit & push success" | tee -a scrape_log.txt
            else
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] Push failed" | tee -a scrape_log.txt
            fi
          fi

          echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] Commit task finished" | tee -a scrape_log.txt
          echo "" >> scrape_log.txt
